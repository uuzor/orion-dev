[build]
  base = ""
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/entities/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/dashboard/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/agents/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
